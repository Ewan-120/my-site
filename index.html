<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1120" />
  <meta name="description" content="纯前端简易计算器，无框架、无构建步骤，仅用于 GitHub Pages 测试。" />
  <title>简易计算器 · GitHub Pages 测试</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23181c2e'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%236c8cff'%3E%3D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="简易计算器">
    <div class="screen">
      <div class="expression" id="expression" aria-live="polite" aria-atomic="true"></div>
      <output class="result" id="result" aria-live="polite" aria-atomic="true">0</output>
    </div>

    <div class="keys">
      <button class="key key--fn" type="button" data-action="clear" aria-label="清空">C</button>
      <button class="key key--fn" type="button" data-action="backspace" aria-label="退格">⌫</button>
      <button class="key key--fn" type="button" data-action="percent" aria-label="百分比">%</button>
      <button class="key key--op" type="button" data-action="operator" data-value="÷" aria-label="除以">÷</button>

      <button class="key" type="button" data-action="digit" data-value="7">7</button>
      <button class="key" type="button" data-action="digit" data-value="8">8</button>
      <button class="key" type="button" data-action="digit" data-value="9">9</button>
      <button class="key key--op" type="button" data-action="operator" data-value="×" aria-label="乘以">×</button>

      <button class="key" type="button" data-action="digit" data-value="4">4</button>
      <button class="key" type="button" data-action="digit" data-value="5">5</button>
      <button class="key" type="button" data-action="digit" data-value="6">6</button>
      <button class="key key--op" type="button" data-action="operator" data-value="-" aria-label="减去">−</button>

      <button class="key" type="button" data-action="digit" data-value="1">1</button>
      <button class="key" type="button" data-action="digit" data-value="2">2</button>
      <button class="key" type="button" data-action="digit" data-value="3">3</button>
      <button class="key key--op" type="button" data-action="operator" data-value="+" aria-label="加上">+</button>

      <button class="key key--fn" type="button" data-action="sign" aria-label="正负号">±</button>
      <button class="key" type="button" data-action="digit" data-value="0">0</button>
      <button class="key" type="button" data-action="dot" aria-label="小数点">.</button>
      <button class="key key--equals" type="button" data-action="equals" aria-label="等于">=</button>
    </div>

    <p class="footer">纯前端静态页 · 仅用于 GitHub Pages 测试</p>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
